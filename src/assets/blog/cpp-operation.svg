<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of an operation</title>
  <desc id="d">The operands 2 and 3 flow into the operator plus, which produces the return value 5.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1200" height="630" rx="24" fill="#0d1117"/>

  <!-- operands -->
  <g font-family="'JetBrains Mono','DejaVu Sans Mono',monospace" font-size="72" font-weight="700" text-anchor="middle">
    <rect x="130" y="130" width="150" height="130" rx="20" fill="none" stroke="#22d3ee" stroke-width="4"/>
    <text x="205" y="222" fill="#22d3ee">2</text>
    <rect x="130" y="370" width="150" height="130" rx="20" fill="none" stroke="#22d3ee" stroke-width="4"/>
    <text x="205" y="462" fill="#22d3ee">3</text>

    <!-- operator -->
    <rect x="505" y="250" width="190" height="130" rx="20" fill="none" stroke="#fb923c" stroke-width="4"/>
    <text x="600" y="342" fill="#fb923c">+</text>

    <!-- return value -->
    <rect x="920" y="250" width="150" height="130" rx="20" fill="none" stroke="#4ade80" stroke-width="4"/>
    <text x="995" y="342" fill="#4ade80">5</text>
  </g>

  <!-- arrows -->
  <g stroke="#8b949e" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M285 195 C 400 195, 400 290, 500 290"/>
    <path d="M285 435 C 400 435, 400 340, 500 340"/>
    <path d="M700 315 L 912 315"/>
  </g>

  <!-- labels -->
  <g font-family="Inter,'DejaVu Sans',sans-serif" font-size="30" text-anchor="middle">
    <text x="205" y="94" fill="#22d3ee">operands</text>
    <text x="600" y="214" fill="#fb923c">operator</text>
    <text x="995" y="214" fill="#4ade80">return value</text>
  </g>
</svg>
